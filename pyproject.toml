[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic-generated migration scripts have their own conventions.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
# The codebase consistently uses single quotes — preserve that.
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
