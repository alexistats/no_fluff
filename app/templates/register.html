{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Register</h2>
    <form method="POST" action="{{ url_for('main.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </div>
        <button type="submit" class="btn primary">Register</button>
    </form>
    <p class="auth-fineprint">
        You must be 16 or older. By creating an account you agree to our
        <a href="{{ url_for('main.terms') }}">Terms</a> and
        <a href="{{ url_for('main.privacy') }}">Privacy Policy</a>.
    </p>
    <p class="auth-link">Already have an account? <a href="{{ url_for('main.login') }}">Login</a></p>
</div>
{% endblock %}
