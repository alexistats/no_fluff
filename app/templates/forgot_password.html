{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Forgot your password?</h2>
    <p class="settings-hint">Enter your account's email address and we'll send you a reset link.</p>
    <form method="POST" action="{{ url_for('main.forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn primary">Send reset link</button>
    </form>
    <p class="auth-link">Remembered it? <a href="{{ url_for('main.login') }}">Log in</a></p>
</div>
{% endblock %}
